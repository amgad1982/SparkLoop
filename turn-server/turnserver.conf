# ==============================================================================
# Coturn Server Configuration for SparkLoop (Oracle Cloud Infrastructure)
# Public IP: 92.4.162.183
# Target: Ubuntu 24.04/26.04 LTS (Ampere A1 ARM64, 2 Cores, 16 GB RAM)
# ==============================================================================

# Network & Listening Ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# Bind to all interfaces (Oracle Cloud NAT)
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# 1:1 NAT External IP Mapping for Oracle Cloud
# Tells Coturn to advertise the public IP in XOR-MAPPED-ADDRESS and XOR-RELAYED-ADDRESS
external-ip=92.4.162.183

# Relay Port Range for UDP Media Forwarding
# Match this range with Oracle Cloud Ingress Security List & Ubuntu iptables
min-port=49152
max-port=65535

# SSL/TLS Certificates (Required for TURNS TLS port 5349 and Web Admin HTTPS)
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/privkey.pem

# Web Admin Interface (HTTPS)
# Accessible via: https://92.4.162.183:8080
web-admin
web-admin-port=8080
web-admin-listen-on-workers

# Persistent SQLite User Database (Required for Web-Admin and User Authentication)
userdb=/var/lib/turn/turndb

# Authentication & Credentials
# Long-Term Credential Mechanism (Standard for WebRTC & LiveKit)
lt-cred-mech
realm=turn.sparkloop.app

# Security & Anti-Abuse
fingerprint
no-multicast-peers
no-cli
no-loopback-peers
mobility

# Prometheus Metrics Exporter (Accessible via http://92.4.162.183:9641/metrics)
prometheus

# Performance Tuning for 2-core ARM & High Concurrency
max-bps=0
bps-capacity=0
stale-nonce=600
