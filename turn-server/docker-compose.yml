# ==============================================================================
# Coturn TURN/STUN Server Docker Compose for Oracle Cloud (ARM64)
# Server IP: 92.4.162.183
# Web Admin Port: 8080 (HTTPS)
# Explicit Host Port Forwarding (Visible in 'docker ps')
# ==============================================================================

services:
  coturn:
    image: coturn/coturn:latest
    container_name: sparkloop-coturn
    restart: always
    ports:
      # STUN / TURN Standard Ports
      - "3478:3478/tcp"
      - "3478:3478/udp"
      # TURNS (TLS) Secure Port
      - "5349:5349/tcp"
      # Coturn Web Admin Dashboard (HTTPS)
      - "8080:8080/tcp"
      # Prometheus Metrics Exporter
      - "9641:9641/tcp"
      # WebRTC UDP Media Relay Port Range
      - "49152-49300:49152-49300/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/etc/coturn/certs:ro
      - ./data:/var/lib/turn
    command: ["-c", "/etc/coturn/turnserver.conf"]
