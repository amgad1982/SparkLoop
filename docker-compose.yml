services:
  postgres:
    image: postgres:17-alpine
    container_name: sparkloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparkloop
      POSTGRES_USER: sparkuser
      POSTGRES_PASSWORD: sparkpassword123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkuser -d sparkloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sparkloop-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: sparkloop-centrifugo
    restart: unless-stopped
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    command: centrifugo -c /centrifugo/config.json
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sparkloop-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword123!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: sparkloop-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --port 7880
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "50000-50050:50000-50050/udp"
    environment:
      LIVEKIT_KEYS: "sparkloop_livekit_key: sparkloop_livekit_secret_2026_super_secure_32chars"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  default:
    name: sparkloop-net
