# ==============================================================================
# LiveKit SFU Server Configuration for Oracle Cloud (TURN-SFU Stack)
# Public IP: 92.4.162.183
# Target: Ubuntu 24.04/26.04 LTS (Ampere A1 ARM64)
# ==============================================================================

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  # Single UDP port multiplexing (all WebRTC media flows through 7882)
  udp_port: 7882
  # TCP fallback port when UDP is blocked by strict enterprise firewalls
  tcp_port: 7881
  # Use explicit static public IP of Oracle Cloud instance
  use_external_ip: false
  node_ip: "92.4.162.183"

  stun_servers:
    - "92.4.162.183:3478"
    - "stun.l.google.com:19302"

  turn_servers:
    - host: "92.4.162.183"
      port: 3478
      protocol: udp
      username: "sparkloop"
      credential: "SparkLoopTurnSecret2026Secure!"
    - host: "92.4.162.183"
      port: 3478
      protocol: tcp
      username: "sparkloop"
      credential: "SparkLoopTurnSecret2026Secure!"
    - host: "92.4.162.183"
      port: 5349
      protocol: tls
      username: "sparkloop"
      credential: "SparkLoopTurnSecret2026Secure!"

# Disable embedded TURN (using colocated Coturn server on 92.4.162.183)
turn:
  enabled: false

# API Authentication Keys (Used by Backend API to issue room JWT tokens)
keys:
  sparkloop_livekit_key: "sparkloop_livekit_secret_2026_super_secure_32chars"

# Room and Participant Lifecycle Webhook Dispatcher
# Dispatches room_started, room_finished, participant_joined, participant_left
# to the SparkLoop Backend API (routed securely via public Cloudflare Tunnel)
webhook:
  api_key: "sparkloop_livekit_key"
  urls:
    - "https://sloopapi.mydev-lab.com/api/livekit/webhook"

logging:
  json: false
  level: info

