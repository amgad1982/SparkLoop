# ==========================================
# SparkLoop Application Docker Compose
# Services: Backend (.NET 10 API) & Frontend (React/Nginx)
# Target Hostnames:
#   - Frontend: https://sloop.mydev-lab.com
#   - Backend:  https://sloopapi.mydev-lab.com
# ==========================================

services:
  sparkloop-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sparkloop-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - DatabaseProvider=PostgreSQL
      - SKIP_SECRET_VALIDATION=${SKIP_SECRET_VALIDATION:-true}
      # The API connects to PgBouncer (transaction-pool mode) rather than directly
      # to Postgres. PgBouncer multiplexes many short-lived client connections
      # onto a small pool of long-lived server connections, which avoids the
      # "Postgres rejected the connection" failure mode when the API scales out.
      - ConnectionStrings__DefaultConnection=Host=sparkloop-pgbouncer;Port=6432;Database=${POSTGRES_DB:-sparkloop};Username=${POSTGRES_USER:-sparkuser};Password=${POSTGRES_PASSWORD:-sparkpassword123!};Pooling=true;Maximum Pool Size=80;Timeout=15;Command Timeout=30
      - ConnectionStrings__Redis=sparkloop-redis:6379,abortConnect=false
      - Centrifugo__ApiUrl=http://sparkloop-centrifugo:8000/api
      - Centrifugo__WsUrl=wss://sloopws.mydev-lab.com/connection/websocket
      - Centrifugo__ApiKey=${CENTRIFUGO_API_KEY:-sparkloop_centrifugo_api_key_2026_super_secure}
      - Centrifugo__SecretKey=${CENTRIFUGO_SECRET_KEY:-sparkloop_centrifugo_secret_jwt_key_2026_super_secure}
      - Storage__ServiceUrl=http://sparkloop-minio:9000
      - Storage__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - Storage__SecretKey=${MINIO_ROOT_PASSWORD:-minioadminpassword123!}
      - Storage__BucketName=${STORAGE_BUCKET_NAME:-sparkloop-media}
      - Storage__PublicUrl=${STORAGE_PUBLIC_URL:-https://sloopmedia.mydev-lab.com/sparkloop-media}
      # LiveKit SFU & Colocated Coturn TURN on Dedicated Host (TURN-SFU stack on 92.4.162.183)
      - LiveKit__ServerUrl=${LIVEKIT_URL:-wss://slooplive.mydev-lab.com}
      - LiveKit__ApiKey=${LIVEKIT_API_KEY:-sparkloop_livekit_key}
      - LiveKit__ApiSecret=${LIVEKIT_API_SECRET:-sparkloop_livekit_secret_2026_super_secure_32chars}
      - LiveKit__Turn__Server=${LIVEKIT_TURN_SERVER:-turn:92.4.162.183:3478}
      - LiveKit__Turn__Username=${LIVEKIT_TURN_USERNAME:-sparkloop}
      - LiveKit__Turn__Credential=${LIVEKIT_TURN_CREDENTIAL:-SparkLoopTurnSecret2026Secure!}
      - CorsOrigins__0=https://sloop.mydev-lab.com
      - CorsOrigins__1=http://localhost:5173
      - CorsOrigins__2=http://localhost:3000
      - CorsOrigins__3=http://localhost:7070
      - CorsOrigins__4=http://127.0.0.1:7070
    networks:
      - sparkloop-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sparkloop-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=https://sloopapi.mydev-lab.com/api
        - VITE_WS_URL=wss://sloopws.mydev-lab.com/connection/websocket
        - VITE_LIVEKIT_URL=wss://slooplive.mydev-lab.com
    container_name: sparkloop-frontend
    restart: unless-stopped
    ports:
      - "7070:80"
    networks:
      - sparkloop-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  sparkloop-net:
    name: sparkloop-net
    external: true
