# ==========================================
# SparkLoop Application Docker Compose
# Services: Backend (.NET 10 API) & Frontend (React/Nginx)
# Target Hostnames:
#   - Frontend: https://sloop.mydev-lab.com
#   - Backend:  https://sloopapi.mydev-lab.com
# ==========================================

services:
  sparkloop-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sparkloop-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - DatabaseProvider=PostgreSQL
      # The API connects to PgBouncer (transaction-pool mode) rather than directly
      # to Postgres. PgBouncer multiplexes many short-lived client connections
      # onto a small pool of long-lived server connections, which avoids the
      # "Postgres rejected the connection" failure mode when the API scales out.
      - ConnectionStrings__DefaultConnection=Host=sparkloop-pgbouncer;Port=6432;Database=sparkloop;Username=sparkuser;Password=sparkpassword123!;Pooling=true;Maximum Pool Size=80;Timeout=15;Command Timeout=30
      - ConnectionStrings__Redis=sparkloop-redis:6379,abortConnect=false
      - Centrifugo__ApiUrl=http://sparkloop-centrifugo:8000/api
      - Centrifugo__WsUrl=wss://sloopws.mydev-lab.com/connection/websocket
      - Centrifugo__ApiKey=sparkloop_centrifugo_api_key_2026_super_secure
      - Centrifugo__SecretKey=sparkloop_centrifugo_secret_jwt_key_2026_super_secure
      - Storage__ServiceUrl=http://sparkloop-minio:9000
      - Storage__AccessKey=minioadmin
      - Storage__SecretKey=minioadminpassword123!
      - Storage__BucketName=sparkloop-media
      - Storage__PublicUrl=https://sloopmedia.mydev-lab.com/sparkloop-media
      - LiveKit__ServerUrl=wss://slooplive.mydev-lab.com
      - LiveKit__ApiKey=sparkloop_livekit_key
      - LiveKit__ApiSecret=sparkloop_livekit_secret_2026_super_secure_32chars
      - CorsOrigins__0=https://sloop.mydev-lab.com
      - CorsOrigins__1=http://localhost:5173
      - CorsOrigins__2=http://localhost:3000
      - CorsOrigins__3=http://localhost:7070
      - CorsOrigins__4=http://127.0.0.1:7070
    networks:
      - sparkloop-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sparkloop-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=https://sloopapi.mydev-lab.com/api
        - VITE_WS_URL=wss://sloopws.mydev-lab.com/connection/websocket
        - VITE_LIVEKIT_URL=wss://slooplive.mydev-lab.com
    container_name: sparkloop-frontend
    restart: unless-stopped
    ports:
      - "7070:80"
    networks:
      - sparkloop-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  sparkloop-net:
    name: sparkloop-net
    external: true
