# ==========================================
# SparkLoop Production Infrastructure Stack
# Private, Zero Host-Port Exposure Network
# All communication is isolated inside 'sparkloop-net'
# ==========================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: sparkloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sparkloop}
      POSTGRES_USER: ${POSTGRES_USER:-sparkuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sparkpassword123!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sparkuser} -d ${POSTGRES_DB:-sparkloop}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # PgBouncer connection pooler sits between the API and Postgres. The API
  # opens many short-lived connections; PgBouncer multiplexes them onto a
  # much smaller pool of long-lived Postgres connections. This avoids the
  # "MaxClients / connection refused" failure mode when the API scales out.
  pgbouncer:
    image: bitnami/pgbouncer:1.23.1
    container_name: sparkloop-pgbouncer
    restart: unless-stopped
    environment:
      PGBOUNCER_DATABASE: ${POSTGRES_DB:-sparkloop}
      PGBOUNCER_USER: ${POSTGRES_USER:-sparkuser}
      PGBOUNCER_PASSWORD: ${POSTGRES_PASSWORD:-sparkpassword123!}
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/userlist.txt
      PGBOUNCER_LISTEN_ADDR: 0.0.0.0
      PGBOUNCER_LISTEN_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "2000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "40"
      PGBOUNCER_MIN_POOL_SIZE: "10"
      PGBOUNCER_RESERVE_POOL_SIZE: "5"
      PGBOUNCER_SERVER_IDLE_TIMEOUT: "600"
      PGBOUNCER_QUERY_TIMEOUT: "30"
      PGBOUNCER_SERVER_TLS_SSLMODE: prefer
    volumes:
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: sparkloop-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: sparkloop-centrifugo
    restart: unless-stopped
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    command: centrifugo -c /centrifugo/config.json
    ports:
      - "8111:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: sparkloop-minio
    restart: unless-stopped
    command: server /data
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword123!}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest
    container_name: sparkloop-livekit
    restart: unless-stopped
    command: --bind 0.0.0.0 --port 7880
    ports:
      - "7880:7880"
      - "50000-50050:50000-50050/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-sparkloop_livekit_key}: ${LIVEKIT_API_SECRET:-sparkloop_livekit_secret_2026_super_secure_32chars}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  default:
    name: sparkloop-net
